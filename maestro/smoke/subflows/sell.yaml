appId: ${APP_ID}
---
- runFlow: launch.yaml
- tapOn:
    id: "buy_button"
- waitForAnimationToEnd
- tapOn:
    id: "bitcoin"
- extendedWaitUntil:
    visible: "Sell ?"
    timeout: 15000
- tapOn: "Sell ?"
- extendedWaitUntil:
    visible:
      id: "fiat_provider"
    timeout: 30000
- assertVisible:
    id: "main_action"
    enabled: false
- takeScreenshot: ${output.journey}_sell
